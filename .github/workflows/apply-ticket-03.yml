name: Apply Ticket 03 Focused Today

on:
  push:
    branches:
      - feature/03-focused-today

permissions:
  contents: write

concurrency:
  group: ticket-03-focused-today
  cancel-in-progress: false

jobs:
  apply-test-commit:
    if: ${{ !contains(github.event.head_commit.message, '[ticket-03]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Reconstruct reviewed source patch
        run: |
          set -euo pipefail
          cat .agent/ticket03.part* > /tmp/ticket03.b64
          base64 -d /tmp/ticket03.b64 | gzip -d > /tmp/ticket03.patch
          echo '58042b2787b5f3dc0454fc0dafbcbced03db056825f7fd9855d0782cbd6ac86a  /tmp/ticket03.patch' | sha256sum -c -
          git apply --check /tmp/ticket03.patch
          git apply /tmp/ticket03.patch
          test -f src/views/Today/Today.jsx
          test -f src/utils/Today.js
          test -f src/utils/Today.test.js

      - name: Install dependencies
        run: npm ci

      - name: Format touched source
        run: |
          npx eslint --fix \
            src/contexts/RouterContext.jsx \
            src/utils/Today.js \
            src/utils/Today.test.js \
            src/views/Today/Today.jsx \
            src/views/components/NavBar.jsx
          npx prettier -w \
            public/locales/en/chores.json \
            public/locales/en/common.json \
            src/contexts/RouterContext.jsx \
            src/utils/Today.js \
            src/utils/Today.test.js \
            src/views/Today/Today.jsx \
            src/views/components/NavBar.jsx

      - name: Run focused selection tests
        run: node --test src/utils/Today.test.js src/utils/ScoreResult.test.js

      - name: Audit localization
        run: npm run lint:i18n

      - name: Lint repository
        run: npm run lint:ci

      - name: Build production frontend
        run: npm run build

      - name: Remove patch transport
        run: |
          rm .agent/ticket03.part*
          rm .github/workflows/apply-ticket-03.yml
          rmdir .agent 2>/dev/null || true

      - name: Validate production diff
        run: |
          set -euo pipefail
          git diff --check
          test ! -d .agent
          test ! -e .github/workflows/apply-ticket-03.yml
          git add -N .
          git diff --name-only origin/develop | sort > /tmp/actual-files
          cat > /tmp/expected-files <<'EOF'
          public/locales/en/chores.json
          public/locales/en/common.json
          src/contexts/RouterContext.jsx
          src/utils/Today.js
          src/utils/Today.test.js
          src/views/Today/Today.jsx
          src/views/components/NavBar.jsx
          EOF
          sort -o /tmp/expected-files /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files

      - name: Commit verified source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add focused Today experience [ticket-03]'
          git push origin HEAD:feature/03-focused-today
