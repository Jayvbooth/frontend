name: Export Source Temporary

on:
  push:
    branches:
      - temp/export-develop-20260826

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source archive
        run: tar --exclude=.git -czf /tmp/frontend-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-develop-source
          path: /tmp/frontend-source.tar.gz
          if-no-files-found: error
          retention-days: 1
