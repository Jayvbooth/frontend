name: Apply Ticket 02 Frontend V2

on:
  push:
    branches:
      - feature/02-timing-aware-scoring-v2

permissions:
  contents: write

concurrency:
  group: ticket-02-frontend-v2
  cancel-in-progress: false

jobs:
  apply-test-commit:
    if: ${{ !contains(github.event.head_commit.message, '[ticket-02-v2]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Reconstruct reviewed source patch
        run: |
          set -euo pipefail
          cat .agent/ticket02-frontend-v2.part* > /tmp/ticket02-frontend.b64
          base64 -d /tmp/ticket02-frontend.b64 | gzip -d > /tmp/ticket02-frontend.patch
          echo 'e890975dbd3cfa7ab4d1c1add0fb417bcd3a8f26ffcbe96e2a470a39b576658e  /tmp/ticket02-frontend.patch' | sha256sum -c -
          git apply --check /tmp/ticket02-frontend.patch
          git apply /tmp/ticket02-frontend.patch
          test -f src/utils/ScoreResult.js
          test -f src/views/components/TimingScoreFields.jsx

      - name: Install dependencies
        run: npm ci

      - name: Format touched frontend files
        run: |
          npx eslint --fix \
            src/utils/ScoreResult.js \
            src/utils/ScoreResult.test.js \
            src/views/ChoreEdit/ChoreEdit.jsx \
            src/views/ChoreEdit/ChoreView.jsx \
            src/views/Chores/ChoreCard.jsx \
            src/views/Chores/CompactChoreCard.jsx \
            src/views/Chores/hooks/useChoreActions.js \
            src/views/History/HistoryCard.jsx \
            src/views/components/AddTaskModal.jsx \
            src/views/components/AdvancedOptionsSection.jsx \
            src/views/components/TimingScoreFields.jsx
          npx prettier --write \
            public/locales/en/chores.json \
            public/locales/en/history.json \
            src/utils/ScoreResult.js \
            src/utils/ScoreResult.test.js \
            src/views/ChoreEdit/ChoreEdit.jsx \
            src/views/ChoreEdit/ChoreView.jsx \
            src/views/Chores/ChoreCard.jsx \
            src/views/Chores/CompactChoreCard.jsx \
            src/views/Chores/hooks/useChoreActions.js \
            src/views/History/HistoryCard.jsx \
            src/views/components/AddTaskModal.jsx \
            src/views/components/AdvancedOptionsSection.jsx \
            src/views/components/TimingScoreFields.jsx

      - name: Run score utility tests
        run: node --test src/utils/ScoreResult.test.js

      - name: Lint and audit localization
        run: npm run lint

      - name: Build production frontend
        run: npm run build

      - name: Remove patch transport
        run: |
          rm .agent/ticket02-frontend-v2.part*
          rm .github/workflows/apply-ticket-02-v2.yml
          rmdir .agent 2>/dev/null || true

      - name: Validate production diff
        run: |
          git diff --check
          test ! -d .agent
          test ! -e .github/workflows/apply-ticket-02-v2.yml
          test -f src/utils/ScoreResult.js
          test -f src/views/components/TimingScoreFields.jsx

      - name: Commit verified source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add timing-aware score controls [ticket-02-v2]'
          git push origin HEAD:feature/02-timing-aware-scoring-v2
