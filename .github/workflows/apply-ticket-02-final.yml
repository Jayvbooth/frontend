name: Apply Ticket 02 Final

on:
  push:
    branches:
      - feature/02-timing-aware-scoring-final

permissions:
  contents: write

concurrency:
  group: ticket-02-final-frontend
  cancel-in-progress: false

jobs:
  apply-test-commit:
    if: ${{ !contains(github.event.head_commit.message, '[ticket-02-final]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply the reviewed production patch
        run: |
          base64 -d .agent/ticket02-frontend.patch.gz.b64 | gzip -d > /tmp/ticket02.patch
          git apply --check /tmp/ticket02.patch
          git apply /tmp/ticket02.patch

      - name: Install dependencies
        run: npm ci

      - name: Format only Ticket 02 files
        run: |
          JS_FILES=$(git diff --name-only --diff-filter=ACM | grep -E '\.(js|jsx)$' || true)
          FORMAT_FILES=$(git diff --name-only --diff-filter=ACM | grep -E '\.(js|jsx|json)$' || true)
          if [ -n "$JS_FILES" ]; then npx eslint --fix $JS_FILES; fi
          if [ -n "$FORMAT_FILES" ]; then npx prettier --write $FORMAT_FILES; fi

      - name: Run focused score feedback tests
        run: node --test src/utils/ScoreResult.test.js

      - name: Lint and audit localization
        run: npm run lint

      - name: Build production frontend
        run: npm run build

      - name: Remove temporary transport files
        run: |
          rm .agent/ticket02-frontend.patch.gz.b64
          rm .github/workflows/apply-ticket-02-final.yml
          rmdir .agent 2>/dev/null || true

      - name: Validate final production diff
        run: |
          git diff --check
          test ! -e .agent/ticket02-frontend.patch.gz.b64
          test ! -e .github/workflows/apply-ticket-02-final.yml

      - name: Commit verified implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add timing-aware score controls [ticket-02-final]'
          git push origin HEAD:feature/02-timing-aware-scoring-final
